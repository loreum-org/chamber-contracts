name: App CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'packages/**'
      - '.github/workflows/app.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'packages/**'
      - '.github/workflows/app.yml'

# Playwright Sepolia e2e is not required here (wallet keys / secrets; see #179 / #182).

jobs:
  app:
    name: Lint, types, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Discovery checks
        run: npm run test:discovery

  operator:
    name: Operator types and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/operator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: packages/operator/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
